<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="iframe-body" style="background: #fff; padding: 20px;">
    <h1>Entrar no MIF</h1>
    <p class="subtitulo">Use seu e-mail institucional do IF Goiano</p>
    <form action="#" method="POST">
        <div class="form-grupo">
            <label for="email-login">E-mail institucional</label>
            <input type="email" id="email-login" name="email" placeholder="seunome@estudante.ifgoiano.edu.br" required>
        </div>
        <div class="form-grupo">
            <label for="senha-login">Senha</label>
            <input type="password" id="senha-login" name="senha" placeholder="Sua senha" required>
        </div>
        <button type="submit" class="btn btn-verde btn-bloco">Entrar</button>
    </form>
</body>
</html>
