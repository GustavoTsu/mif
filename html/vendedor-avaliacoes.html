<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Avaliações do Vendedor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="iframe-body" style="background: #fff; padding: 20px;">
    <div class="vendedor-stats-box">
        <div class="text-center">
            <div class="rating-big">4,2</div>
            <div class="estrelas text-large">&#9733;&#9733;&#9733;&#9733;&#9734;</div>
            <div class="text-small text-cinza mt-8">12 avaliações</div>
        </div>
        <div class="flex-1">
            <div class="rating-bar-container">
                <span class="w-16 text-right">5</span><span class="text-yellow">&#9733;</span>
                <div class="rating-bar-bg"><div class="rating-bar-fill w-70"></div></div>
            </div>
            <div class="rating-bar-container">
                <span class="w-16 text-right">4</span><span class="text-yellow">&#9733;</span>
                <div class="rating-bar-bg"><div class="rating-bar-fill w-20"></div></div>
            </div>
        </div>
    </div>
    <div class="secao-avaliacoes">
        <h2>Avaliações recebidas</h2>
        <div class="card-avaliacao">
            <div class="cabecalho-avaliacao">
                <div class="avatar-placeholder-small">M</div>
                <div>
                    <div class="nome-avaliador">Maria Souza</div>
                    <span class="estrelas text-small">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
                </div>
                <span class="data-avaliacao">02/04/2025</span>
            </div>
            <p class="comentario">Ótimo vendedor! Jaleco em perfeito estado.</p>
        </div>
    </div>
</body>
</html>
