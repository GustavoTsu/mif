<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Segurança do Perfil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="iframe-body" style="background: #fff; padding: 20px;">
    <div class="form-card max-w-480">
        <h2 class="secao-titulo">Alterar senha</h2>
        <form action="#" method="POST">
            <div class="form-grupo">
                <label for="senha-atual">Senha atual *</label>
                <input type="password" id="senha-atual" name="senha_atual" required>
            </div>
            <div class="form-grupo">
                <label for="nova-senha">Nova senha *</label>
                <input type="password" id="nova-senha" name="nova_senha" required minlength="8">
            </div>
            <button type="submit" class="btn btn-verde">Alterar senha</button>
        </form>
    </div>
</body>
</html>
