<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="iframe-body" style="background: #fff; padding: 20px;">
    <h1>Criar conta</h1>
    <p class="subtitulo">Somente estudantes do Instituto Federal Goiano</p>
    <form action="#" method="POST">
        <div class="form-grupo">
            <label for="nome-cadastro">Nome completo</label>
            <input type="text" id="nome-cadastro" name="nome" placeholder="Seu nome completo" required>
        </div>
        <div class="form-grupo">
            <label for="email-cadastro">E-mail institucional</label>
            <input type="email" id="email-cadastro" name="email" placeholder="seunome@estudante.ifgoiano.edu.br" required>
        </div>
        <div class="form-grupo">
            <label for="matricula">Matrícula</label>
            <input type="text" id="matricula" name="matricula" placeholder="Ex.: 2023101234" required>
        </div>
        <button type="submit" class="btn btn-verde btn-bloco">Criar conta</button>
    </form>
</body>
</html>
